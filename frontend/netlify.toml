# Netlify build config for the frontend.
#
# Set these in Netlify -> Site settings -> Environment variables (not here -
# they differ per site, and VITE_* values are baked into the bundle at build
# time, so a change needs a rebuild):
#
#   VITE_SUPABASE_URL       your Supabase project URL
#   VITE_SUPABASE_ANON_KEY  the publishable key
#   VITE_API_URL            your Render API URL, e.g. https://...onrender.com
#
# VITE_API_URL is what makes the frontend call the API on its own domain
# instead of /api on this one. The backend must list this site's origin in
# CORS_ORIGINS or the browser will block the calls.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# The app is a single page; every route must return index.html rather than a
# 404 from the CDN.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
