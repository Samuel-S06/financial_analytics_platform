# Nginx config for the frontend container.
#
# Serves the static React build out of /usr/share/nginx/html, and forwards
# /api/* to the backend. The BACKEND_URL is templated in at container start
# via envsubst (see Dockerfile CMD), which lets the same image run in
# different environments (k8s service DNS, docker network alias, etc.).

server {
    listen 80;
    server_name _;

    # Serve the SPA. try_files makes client-side routing work: any unknown
    # path falls through to index.html, where React Router (or whatever) takes
    # over. We don't currently use a router, but it's the right default.
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend. The /api prefix is stripped before
    # forwarding because our FastAPI routes are defined as /health, /hello,
    # etc. - not /api/health.
    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}