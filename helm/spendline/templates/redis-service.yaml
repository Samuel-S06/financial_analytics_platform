apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "spendline.labels" . | nindent 4 }}
spec:
  # clusterIP: None makes this a "headless" service - DNS lookups return the
  # pod IPs directly rather than a load-balanced VIP. That's what StatefulSets
  # want, so each pod has a stable DNS name like redis-0.redis.<namespace>.svc.
  clusterIP: None
  selector:
    app: redis
  ports:
  - name: redis
    port: {{ .Values.redis.port }}
    targetPort: {{ .Values.redis.port }}