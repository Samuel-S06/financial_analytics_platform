apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "financial-platform.labels" . | nindent 4 }}
spec:
  # ClusterIP because external traffic comes through the ingress, not directly
  # to the backend. Reduces attack surface.
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: http
    port: {{ .Values.backend.port }}
    targetPort: {{ .Values.backend.port }}