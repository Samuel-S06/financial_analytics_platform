apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "financial-platform.labels" . | nindent 4 }}
data:
  # Backend reads these via pydantic-settings. Pointing at the in-cluster
  # Redis service - resolves via k8s DNS as <service-name>.<namespace>.svc.cluster.local
  # but the short form works within the same namespace.
  REDIS_HOST: "redis"
  REDIS_PORT: "{{ .Values.redis.port }}"
  USE_REDIS: "false"  # flip to "true" once real backend code is wired in
  SERVICE_NAME: "financial-platform-backend"